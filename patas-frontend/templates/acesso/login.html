<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar · Ampara | Patas do Bem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/modals.css}">
    <link rel="stylesheet" th:href="@{/css/acesso.css}">
</head>
<body>
<div class="auth-layout">
    <div th:replace="~{fragments/acesso-aside :: aside('Juntos, por', 'novos começos.', 'Adote, ajude e acompanhe cada passo. Uma rede que cuida de quem mais precisa.')}"></div>

    <main class="auth-main">
        <div class="auth-form-container">
            <div class="auth-top-nav">
                <a th:href="@{/}" class="auth-back-link">← Voltar ao site</a>
            </div>

            <h2 class="auth-heading">Que bom ter você aqui.</h2>
            <p class="auth-subheading">Entre na sua conta e continue fazendo a diferença.</p>

            <div class="profile-tabs" role="tablist" aria-label="Tipo de perfil">
                <button type="button" class="profile-tab is-active" data-profile-tab="usuario" role="tab" aria-selected="true">
                    Perfil Usuário
                </button>
                <button type="button" class="profile-tab" data-profile-tab="admin" role="tab" aria-selected="false">
                    Perfil Administrador
                </button>
            </div>

            <form id="form-login" class="auth-form">
                <input type="hidden" id="login-perfil" name="perfil" value="usuario">

                <div class="form-group">
                    <label for="login-email" class="form-label">E-mail</label>
                    <input id="login-email" name="email" type="email" class="form-control" value="ana.souza@exemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="login-senha" class="form-label">Senha</label>
                    <input id="login-senha" name="senha" type="password" class="form-control" value="••••••••••" required>
                </div>

                <div class="forgot-row">
                    <button type="button" class="text-action-link" data-open-modal="modal-recuperar">
                        Esqueci minha senha
                    </button>
                </div>

                <div id="login-feedback" class="modal-feedback" role="status"></div>

                <button id="login-submit-btn" type="submit" class="btn btn-primary btn-full">
                    Entrar como usuário
                </button>

                <p id="login-perfil-note" class="auth-helper-note">
                    Conta pessoal para adotar, doar e acompanhar.
                </p>
            </form>

            <div class="auth-divider-block">
                <p class="auth-question">Ainda não tem uma conta?</p>
                <a th:href="@{/registrar}" class="btn btn-soft btn-full">Registrar-se</a>
                <p class="auth-helper-note">Seu cadastro terá perfil de Usuário.</p>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/modals :: modals}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
