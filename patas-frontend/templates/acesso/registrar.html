<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar-se · Ampara | Patas do Bem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/modals.css}">
    <link rel="stylesheet" th:href="@{/css/acesso.css}">
</head>
<body>
<div class="auth-layout">
    <div th:replace="~{fragments/acesso-aside :: aside('Uma conta.', 'Muitos novos começos.', 'Uma conta para adotar, ajudar e acompanhar as histórias que você transforma.')}"></div>

    <main class="auth-main">
        <div class="auth-form-container">
            <div class="auth-top-nav">
                <a th:href="@{/entrar}" class="auth-back-link">← Já tenho conta</a>
            </div>

            <h2 class="auth-heading">Faça parte dessa rede.</h2>
            <p class="auth-subheading">Crie sua conta para adotar, ajudar e acompanhar.</p>

            <form id="form-registrar" class="auth-form">
                <div class="form-group">
                    <label for="reg-nome" class="form-label">Nome completo *</label>
                    <input id="reg-nome" name="nome" type="text" class="form-control" value="Ana Souza" required>
                </div>

                <div class="form-group">
                    <label for="reg-email" class="form-label">E-mail *</label>
                    <input id="reg-email" name="email" type="email" class="form-control" value="ana.souza@exemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="reg-senha" class="form-label">Senha *</label>
                    <input id="reg-senha" name="senha" type="password" class="form-control" value="••••••••••" required>
                    <span class="field-hint">Use pelo menos 8 caracteres.</span>
                </div>

                <div class="form-group">
                    <label for="reg-confirmar" class="form-label">Confirmar senha *</label>
                    <input id="reg-confirmar" name="confirmarSenha" type="password" class="form-control" value="••••••••••" required>
                </div>

                <label class="checkbox-row">
                    <input id="reg-termos" name="termos" type="checkbox" checked>
                    <span>Concordo com os Termos de uso e a Privacidade.</span>
                </label>

                <div id="registrar-feedback" class="modal-feedback" role="status"></div>

                <button type="submit" class="btn btn-primary btn-full">Criar conta de usuário</button>
            </form>

            <div class="auth-inline-link-row">
                <a th:href="@{/entrar}">Já tenho conta — Entrar</a>
            </div>

            <p class="auth-helper-note">
                Seu perfil será Usuário. O acesso de Administrador é concedido apenas pela ONG, mediante autorização.
            </p>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
