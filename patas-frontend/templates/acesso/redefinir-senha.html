<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha · Ampara | Patas do Bem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/modals.css}">
    <link rel="stylesheet" th:href="@{/css/acesso.css}">
</head>
<body>
<div class="auth-layout">
    <div th:replace="~{fragments/acesso-aside :: aside('Seu acesso seguro.', 'Seu cuidado continua.', 'Crie uma nova senha para continuar acompanhando suas histórias de cuidado.')}"></div>

    <main class="auth-main">
        <div class="auth-form-container">
            <h2 class="auth-heading">Crie uma nova senha.</h2>
            <p class="auth-subheading">Use uma senha diferente da anterior.</p>

            <form id="form-redefinir" class="auth-form">
                <div class="form-group">
                    <label for="new-senha" class="form-label">Nova senha *</label>
                    <input id="new-senha" name="novaSenha" type="password" class="form-control" value="Ampara2026" required>
                </div>

                <div class="form-group">
                    <label for="new-confirmar" class="form-label">Confirmar nova senha *</label>
                    <input id="new-confirmar" name="confirmarNovaSenha" type="password" class="form-control" value="Ampara2026" required>
                    <span class="field-hint">Use pelo menos 8 caracteres, com letras e números.</span>
                </div>

                <div id="redefinir-feedback" class="modal-feedback" role="status"></div>

                <div class="auth-actions-stack">
                    <button type="submit" class="btn btn-primary btn-full">Salvar nova senha</button>
                    <a th:href="@{/entrar}" class="btn btn-soft btn-full">Voltar ao login</a>
                </div>
            </form>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
