<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar voluntário · Ampara Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/modals.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">
<div class="admin-layout">
    <div th:replace="~{fragments/admin-layout :: sidebar(${menuAtivo}, ${pendentesCount})}"></div>

    <div class="admin-main-col">
        <div th:replace="~{fragments/admin-layout :: topbar('Área administrativa')}"></div>

        <main class="admin-content" style="display:flex;justify-content:center;padding-top:36px;">
            <form th:action="@{/admin/voluntarios/novo}" method="post" class="admin-form-card" style="width:100%;max-width:740px;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
                    <p class="admin-eyebrow" style="margin-bottom:0;">NOVO REGISTRO INTERNO</p>
                    <a th:href="@{/admin/voluntarios}" class="admin-btn-soft" style="height:36px;">Fechar registro</a>
                </div>
                <h1 class="admin-title" style="margin-bottom:22px;">Cadastrar voluntário</h1>

                <div class="modal-form">
                    <div class="form-group">
                        <label class="form-label" for="vl-nome">Nome completo *</label>
                        <input id="vl-nome" name="nome" type="text" class="form-control" value="Daniela Ribeiro" required>
                    </div>
                    <div class="form-row-2">
                        <div class="form-group">
                            <label class="form-label" for="vl-email">E-mail *</label>
                            <input id="vl-email" name="email" type="email" class="form-control" value="daniela@exemplo.com" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Telefone *</label>
                            <input type="text" class="form-control" value="(11) 99999-0148" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="vl-frente">Frente de atuação *</label>
                        <select id="vl-frente" name="frente" class="form-control">
                            <option value="Passeios e socialização">Passeios e socialização</option>
                            <option value="Eventos e campanhas">Eventos e campanhas</option>
                            <option value="Transporte solidário">Transporte solidário</option>
                            <option value="Lar temporário">Lar temporário</option>
                            <option value="Apoio ao abrigo">Apoio ao abrigo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="vl-disp">Disponibilidade *</label>
                        <input id="vl-disp" name="disponibilidade" type="text" class="form-control" value="Sábados e domingos pela manhã" required>
                    </div>

                    <p class="table-sub-text" style="margin-top:4px;">Situação inicial: em integração. Não concede acesso administrativo.</p>
                </div>

                <div class="admin-form-actions" style="justify-content:flex-end;">
                    <button type="submit" class="admin-btn-primary">Salvar voluntário</button>
                </div>
            </form>
        </main>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: meuPerfilModal}"></div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
