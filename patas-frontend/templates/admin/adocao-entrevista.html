<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar entrevista · Ampara Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/modals.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">
<div class="admin-layout">
    <div th:replace="~{fragments/admin-layout :: sidebar(${menuAtivo}, ${pendentesCount})}"></div>

    <div class="admin-main-col">
        <div th:replace="~{fragments/admin-layout :: topbar('Área administrativa')}"></div>

        <main class="admin-content">
            <div class="admin-page-head">
                <div>
                    <p class="admin-eyebrow" th:text="${'ADOÇÕES / #' + solicitacao.codigo + ' / ENTREVISTA'}">ADOÇÕES / #AD-0048 / ENTREVISTA</p>
                    <h1 class="admin-title" th:text="${'Agendar conversa com ' + solicitacao.adotanteNome}">Agendar conversa com Ana</h1>
                    <p class="admin-subtitle">Confirme o horário com a candidata antes de registrar a entrevista.</p>
                </div>
            </div>

            <form th:action="@{/admin/adocoes/{c}/entrevista(c=${solicitacao.codigo})}" method="post">
                <section class="admin-card">
                    <div class="modal-form">
                        <div class="form-group">
                            <label class="form-label">Candidata</label>
                            <input type="text" class="form-control" th:value="${solicitacao.adotanteNome + ' · ' + solicitacao.animalNome + ' · #' + solicitacao.codigo}" readonly>
                        </div>
                        <div class="form-row-2">
                            <div class="form-group">
                                <label class="form-label">Data combinada</label>
                                <input type="text" class="form-control" value="20/11/2026" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Horário</label>
                                <input type="text" class="form-control" value="14:00" required>
                            </div>
                        </div>
                        <div class="form-row-2">
                            <div class="form-group">
                                <label class="form-label">Formato</label>
                                <input type="text" class="form-control" value="Presencial · ONG Patas do Bem" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Responsável</label>
                                <input type="text" class="form-control" value="Mariana Costa" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Orientações para a candidata</label>
                            <input type="text" class="form-control" value="Levar documento de identificação e conversar sobre a rotina.">
                        </div>
                        <p class="admin-subtitle" style="margin-top:4px;">Ao salvar, a solicitação passa para "Entrevista agendada". O envio da mensagem deve ser combinado com a ONG.</p>
                    </div>
                </section>

                <div class="admin-form-actions">
                    <a th:href="@{/admin/adocoes/{c}/analisar(c=${solicitacao.codigo})}" class="admin-btn-soft">Voltar à análise</a>
                    <button type="submit" class="admin-btn-primary">Confirmar agendamento</button>
                </div>
            </form>
        </main>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: meuPerfilModal}"></div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
