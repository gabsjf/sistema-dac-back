<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encerrar solicitação · Ampara Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/modals.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">
<div class="admin-layout">
    <div th:replace="~{fragments/admin-layout :: sidebar(${menuAtivo}, ${pendentesCount})}"></div>

    <div class="admin-main-col">
        <div th:replace="~{fragments/admin-layout :: topbar('Seu espaço de cuidado')}"></div>

        <main class="admin-content">
            <div class="admin-page-head">
                <div>
                    <p class="admin-eyebrow" th:text="${'ADOÇÕES / #' + solicitacao.codigo + ' / DECISÃO'}">ADOÇÕES / #AD-0048 / DECISÃO</p>
                    <h1 class="admin-title">Registrar decisão da análise</h1>
                    <p class="admin-subtitle">A decisão deve ser explicada com respeito. Nada é encerrado sem justificativa.</p>
                </div>
            </div>

            <form th:action="@{/admin/adocoes/{c}/encerrar(c=${solicitacao.codigo})}" method="post" class="admin-form-card">
                <div class="modal-form">
                    <div class="form-row-2">
                        <div class="form-group">
                            <label class="form-label">Solicitação</label>
                            <input type="text" class="form-control" th:value="${solicitacao.adotanteNome + ' · ' + solicitacao.animalNome + ' · #' + solicitacao.codigo}" readonly>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Decisão</label>
                            <input type="text" class="form-control" value="Não aprovada" readonly>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Motivo para a candidata</label>
                        <input type="text" class="form-control" value="A equipe recomenda um animal com necessidades mais compatíveis com a rotina da família." required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mensagem à candidata</label>
                        <textarea class="form-control form-textarea">Obrigada pelo interesse em Luna. Nossa equipe está à disposição para indicar outros animais compatíveis.</textarea>
                    </div>
                </div>
                <div class="admin-form-actions">
                    <a th:href="@{/admin/adocoes/{c}/analisar(c=${solicitacao.codigo})}" class="admin-btn-soft">Manter em análise</a>
                    <button type="submit" class="admin-btn-primary">Confirmar encerramento</button>
                </div>
            </form>
        </main>
    </div>
</div>
<div th:replace="~{fragments/admin-layout :: meuPerfilModal}"></div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
