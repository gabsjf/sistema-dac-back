
<div class="page-shell">

  <!-- CABEÇALHO -->
  <header class="site-header">
    <a routerLink="/" class="brand-link" aria-label="Patas do Bem - Página inicial">
      <span class="brand-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="7.5" cy="9.5" r="1.9"/>
          <circle cx="11.2" cy="6.8" r="1.9"/>
          <circle cx="15.3" cy="7.6" r="1.8"/>
          <circle cx="17.8" cy="11.2" r="1.7"/>
          <path d="M12.2 11.4c-2.6 0-4.9 1.8-5.3 4.3-.3 1.7.9 3.1 2.6 3.1 1 0 1.8-.4 2.7-.4.9 0 1.7.4 2.7.4 1.7 0 2.9-1.4 2.6-3.1-.4-2.5-2.7-4.3-4.3z"/>
        </svg>
      </span>

      <span class="brand-text">
        <span class="brand-title">Patas do Bem</span>
        <span class="brand-subtitle">PROTEÇÃO ANIMAL</span>
      </span>
    </a>

    <div class="header-actions">
      <a routerLink="/" class="btn btn-soft">Início</a>
      <a routerLink="/registrar" class="btn btn-header-primary">
        Registrar-se
      </a>
    </div>
  </header>

  <main class="login-main">

    <section class="login-card" aria-labelledby="login-titulo">

      <div class="login-header">
        <p class="hero-eyebrow">BEM-VINDO DE VOLTA</p>

        <h1 id="login-titulo">Entre na sua conta</h1>

        <p>
          Acesse sua conta para acompanhar os animais
          e participar do processo de adoção.
        </p>
      </div>

      <form #formLogin="ngForm" (ngSubmit)="entrar()">

        <div class="login-campo">
          <label for="email">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            placeholder="Digite seu e-mail"
            autocomplete="email"
            required
            email
          >
        </div>

        <div class="login-campo">
          <label for="senha">Senha</label>
          <input
            id="senha"
            name="senha"
            type="password"
            [(ngModel)]="senha"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          >
        </div>

        <p class="login-esqueci">
          <a routerLink="/esqueci-senha">Esqueci minha senha</a>
        </p>

        @if (erro()) {
          <p class="login-erro" role="alert">
            {{ erro() }}
          </p>
        }

        <button
          type="submit"
          class="btn btn-primary btn-full"
          [disabled]="formLogin.invalid || entrando()"
        >
          {{ entrando() ? 'Entrando...' : 'Entrar' }}
        </button>

      </form>

      <p class="login-cadastro">
        Ainda não possui uma conta?
        <a routerLink="/registrar">Cadastre-se</a>
      </p>

    </section>

  </main>
</div>
